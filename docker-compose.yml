x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# PRODUKSI. Hanya service `app`; database = Supabase (DATABASE_URL di .env).
# Sama dengan compose produksi (izerhaf7/smile-backendsrv commit 2f2292e) + mount ./models
# (file model RF, lihat README "RF: shadow mode dan active mode").
# Simulasi menambah Postgres lokal lewat docker-compose.sim.yml (dipakai sim/sim.sh), JANGAN di produksi.
services:
  app:
    build: .
    image: smile-ingest:latest
    container_name: smile-ingest-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - .env
    volumes:
      - ./models:/srv/models:ro
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging
